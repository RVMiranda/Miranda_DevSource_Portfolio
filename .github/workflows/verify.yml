name: Verify portfolio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        contact: [direct, form]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PUBLIC_FORMSPREE_ENDPOINT: ${{ matrix.contact == 'form' && 'https://formspree.io/f/testform' || '' }}
      TEST_FORM: ${{ matrix.contact == 'form' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.os }}-${{ matrix.contact }}
          path: playwright-report/
          retention-days: 7
